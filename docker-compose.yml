# ─────────────────────────────────────────────────────────────────────────────
# Los dos sitios se construyen desde el monorepo y se sirven como estáticos.
# El contexto de build es la raíz del repo (no la carpeta de la app) porque el
# Dockerfile necesita el lockfile y los paquetes compartidos de packages/.
# ─────────────────────────────────────────────────────────────────────────────

# La analítica vive aparte, en compose.analytics.yml. Compose interpola el
# archivo entero antes de elegir qué servicios levantar, así que tener acá los
# guardas `${VAR:?}` de Umami haría fallar el despliegue de los sitios en
# cualquier instalación que no quiera analítica.
#
#   Solo los sitios:   docker compose up -d
#   Con analítica:     docker compose -f docker-compose.yml -f compose.analytics.yml up -d
#
# Nombre de proyecto explícito. Sin esto, Compose lo deduce del nombre de la
# carpeta: clonar el repo con otro nombre crearía una red distinta y un stack
# paralelo que pelearía por los mismos `container_name` que el ya existente.
name: sites

services:
  web-ramiro:
    build:
      context: .
      dockerfile: apps/ramiroagustin/Dockerfile
      args:
        APP: ramiroagustin
        # Vacías por defecto: sin ellas el sitio se compila sin analítica.
        VITE_ANALYTICS_SRC: ${VITE_ANALYTICS_SRC:-}
        VITE_ANALYTICS_ID: ${ANALYTICS_ID_RAMIROAGUSTIN:-}
    image: sites/ramiroagustin:latest
    container_name: web-ramiro
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web

  web-bytefix:
    build:
      context: .
      dockerfile: apps/bytefix/Dockerfile
      args:
        APP: bytefix
        # Vacías por defecto: sin ellas el sitio se compila sin analítica.
        VITE_ANALYTICS_SRC: ${VITE_ANALYTICS_SRC:-}
        VITE_ANALYTICS_ID: ${ANALYTICS_ID_BYTEFIX:-}
    image: sites/bytefix:latest
    container_name: web-bytefix
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web

  # ─── Sistema de órdenes de servicio ────────────────────────────────────────
  # Único servicio con proceso Node en runtime: tiene base de datos y
  # formularios. Los dos sitios siguen siendo nginx + estáticos.
  #
  # Se publica por el mismo túnel, en su propio subdominio, y va detrás de
  # Cloudflare Access: es un panel de administración, no una página pública.
  taller:
    build:
      context: .
      dockerfile: apps/taller/Dockerfile
    image: sites/taller:latest
    container_name: taller
    restart: unless-stopped
    environment:
      TALLER_DATOS: /datos
      TALLER_PASSWORD_HASH: ${TALLER_PASSWORD_HASH:?falta TALLER_PASSWORD_HASH en el archivo .env}
      TALLER_URL_PUBLICA: ${TALLER_URL_PUBLICA:-}
      TALLER_SMTP_USUARIO: ${TALLER_SMTP_USUARIO:-}
      TALLER_SMTP_CLAVE: ${TALLER_SMTP_CLAVE:-}
      TALLER_EMAIL_NOMBRE: ${TALLER_EMAIL_NOMBRE:-ByteFix}
      TALLER_EMAIL_COPIA: ${TALLER_EMAIL_COPIA:-}
    volumes:
      # Base de datos, PDFs y fotos. Es lo único que tiene que sobrevivir a un
      # `docker compose up --build`. Ojo: `down -v` sí lo borra.
      - taller-datos:/datos
    expose:
      - "3100"
    # Acceso local atado a 127.0.0.1, igual que Umami: permite entrar por SSH
    # sin pasar por internet, que es lo que salva el día si el túnel se cae
    # justo con un cliente esperando.
    #
    #   ssh -L 3100:localhost:3100 pi@raspberrypi
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - web

  # Enruta ambos dominios desde Cloudflare hacia los contenedores.
  # No abre ningún puerto hacia internet: la conexión sale desde adentro.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?falta TUNNEL_TOKEN en el archivo .env}
    networks:
      - web
    depends_on:
      web-ramiro:
        condition: service_healthy
      web-bytefix:
        condition: service_healthy

networks:
  web:
    driver: bridge

volumes:
  taller-datos:
