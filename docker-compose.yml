# ─────────────────────────────────────────────────────────────────────────────
# Los dos sitios se construyen desde el monorepo y se sirven como estáticos.
# El contexto de build es la raíz del repo (no la carpeta de la app) porque el
# Dockerfile necesita el lockfile y los paquetes compartidos de packages/.
# ─────────────────────────────────────────────────────────────────────────────

# Nombre de proyecto explícito. Sin esto, Compose lo deduce del nombre de la
# carpeta: clonar el repo con otro nombre crearía una red distinta y un stack
# paralelo que pelearía por los mismos `container_name` que el ya existente.
name: sites

services:
  web-ramiro:
    build:
      context: .
      dockerfile: apps/ramiroagustin/Dockerfile
      args:
        APP: ramiroagustin
        # Vacías por defecto: sin ellas el sitio se compila sin analítica.
        VITE_ANALYTICS_SRC: ${VITE_ANALYTICS_SRC:-}
        VITE_ANALYTICS_ID: ${ANALYTICS_ID_RAMIROAGUSTIN:-}
    image: sites/ramiroagustin:latest
    container_name: web-ramiro
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web

  web-bytefix:
    build:
      context: .
      dockerfile: apps/bytefix/Dockerfile
      args:
        APP: bytefix
        # Vacías por defecto: sin ellas el sitio se compila sin analítica.
        VITE_ANALYTICS_SRC: ${VITE_ANALYTICS_SRC:-}
        VITE_ANALYTICS_ID: ${ANALYTICS_ID_BYTEFIX:-}
    image: sites/bytefix:latest
    container_name: web-bytefix
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web

  # Enruta ambos dominios desde Cloudflare hacia los contenedores.
  # No abre ningún puerto hacia internet: la conexión sale desde adentro.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?falta TUNNEL_TOKEN en el archivo .env}
    networks:
      - web
    depends_on:
      web-ramiro:
        condition: service_healthy
      web-bytefix:
        condition: service_healthy

  # ─── Analítica autohospedada ───────────────────────────────────────────────
  # Umami: sin cookies, sin datos personales, sin terceros. Los datos quedan
  # en la Pi. Se publica por el mismo túnel, en su propio subdominio.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?falta UMAMI_DB_PASSWORD en .env}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?falta UMAMI_APP_SECRET en .env}
    expose:
      - "3000"
    networks:
      - web
    depends_on:
      umami-db:
        condition: service_healthy

  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?falta UMAMI_DB_PASSWORD en .env}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    # No se expone ningún puerto: solo se llega desde la red interna.
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  # Los datos de analítica sobreviven a `docker compose down`. Ojo: `down -v`
  # sí los borra.
  umami-db-data:

networks:
  web:
    driver: bridge
