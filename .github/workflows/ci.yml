name: CI

# `develop` es la rama de trabajo, así que también se verifica al empujar: una
# regresión conviene verla al hacer push y no días después, al abrir el PR con
# veinte commits encima. `bytefix` es el canal comercial del taller y sale de
# acá, así que el costo de enterarse tarde no es solo incomodidad.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Chequeo de tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm exec prettier --check .

      # Antes del build: es la etapa más rápida de las que pueden fallar por
      # una regresión de lógica, y no tiene sentido compilar dos sitios para
      # enterarse después.
      - name: Tests
        run: pnpm test

      - name: Build de los dos sitios
        run: pnpm build

      - name: Verificar páginas prerenderizadas y hashes de CSP
        run: pnpm verify:build
