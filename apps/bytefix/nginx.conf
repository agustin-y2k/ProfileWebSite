server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # ── Compresión ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml image/svg+xml;

    # ── Cabeceras de seguridad ───────────────────────────────────────────────
    #
    # Sobre `script-src 'unsafe-inline'`: el <head> lleva dos scripts inline
    # que no se pueden diferir sin romper la experiencia — el que fija el tema
    # antes del primer paint y el que agrega la clase `js`— más el bloque
    # JSON-LD, que Chrome también somete a script-src. Como nginx sirve
    # estáticos, no hay forma de generar un nonce por request.
    #
    # `script-src 'self'` sigue bloqueando la carga de JS desde otro origen,
    # que es el vector real en un sitio sin entrada de usuario ni formularios.
    # Para endurecerlo habría que calcular los hashes SHA-256 de cada script
    # inline en el build e inyectarlos acá.
    # `always` es necesario: sin él nginx omite la cabecera en respuestas de
    # error (4xx/5xx). Se repiten dentro de cada `location` porque un
    # `add_header` en un bloque hijo descarta todos los heredados del padre.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://analytics.ramiroagustin.online; font-src 'self'; connect-src 'self' https://analytics.ramiroagustin.online; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # El origen de la analítica aparece en script-src y connect-src: sin eso
    # la CSP bloquearía tanto la carga del script como el envío de los eventos.
    # Si el subdominio cambia, hay que actualizarlo en las dos directivas de
    # este archivo (la del bloque server y la del `location /`).

    # Nota sobre el caché: se usa solo `add_header Cache-Control` y no la
    # directiva `expires`. `expires` emite su propio Cache-Control, así que
    # combinarlas hace que la respuesta salga con la cabecera duplicada.

    # ── Tabla de precios en vivo ─────────────────────────────────────────────
    #
    # Las filas de la tabla no están horneadas en el HTML: el `index.html`
    # trae un `<!--#include virtual="/tarifas" -->` que nginx resuelve en cada
    # visita contra el sistema de órdenes. Así, cambiar un precio en el panel
    # se ve acá sin reconstruir la imagen ni reiniciar el contenedor.
    #
    # Es del lado del servidor a propósito: la tabla llega hecha en el HTML,
    # sin fetch, sin JavaScript y sin tocar la CSP. Un buscador la indexa y un
    # navegador con JS apagado la ve igual.

    # El contenedor del taller puede no estar levantado —o no existir todavía—
    # cuando nginx arranca. Con el nombre escrito literal en `proxy_pass`,
    # nginx lo resuelve al cargar la configuración y se niega a arrancar si no
    # resuelve. Puesto en una variable, la resolución pasa a ser por request y
    # usa este resolver, que es el DNS interno de Docker.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /tarifas {
        # `internal`: desde afuera devuelve 404. Solo la incluye el SSI, que sí
        # alcanza las locations internas. Importante que no haya ningún
        # `error_page` acá adentro: atraparía ese mismo 404 y convertiría la
        # ruta en pública sin querer.
        internal;

        set $taller "taller:3100";
        proxy_pass http://$taller/tarifas.html;

        # Timeouts cortos: si el taller se cuelga, la página de precios no
        # puede quedarse esperándolo. Peor caso, dos segundos y el respaldo.
        proxy_connect_timeout 1s;
        proxy_send_timeout    2s;
        proxy_read_timeout    2s;

        # Sin esto, un 404 o un 500 del taller entrarían tal cual en la tabla:
        # el include pondría el cuerpo del error entre los `<tr>`. Interceptado,
        # cuenta como error y el SSI cae en el respaldo.
        proxy_intercept_errors on;
    }

    # ── Assets con hash en el nombre: cachean para siempre ───────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Fuentes ──────────────────────────────────────────────────────────────
    location ~* \.(woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Imágenes y favicons: sin hash, caché moderada ────────────────────────
    location ~* \.(png|webp|jpe?g|gif|ico|svg|avif)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── SEO ──────────────────────────────────────────────────────────────────
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # ── HTML: nunca cachear, así un deploy se ve al instante ─────────────────
    location / {
        # Resuelve el `<!--#include virtual="/tarifas" -->` de la tabla de
        # precios. Solo se procesan respuestas text/html, así que no toca ni
        # los assets ni las fuentes.
        ssi on;

        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://analytics.ramiroagustin.online; font-src 'self'; connect-src 'self' https://analytics.ramiroagustin.online; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
