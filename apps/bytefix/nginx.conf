server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # ── Compresión ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml image/svg+xml;

    # ── Cabeceras de seguridad ───────────────────────────────────────────────
    #
    # Sobre `script-src 'unsafe-inline'`: el <head> lleva dos scripts inline
    # que no se pueden diferir sin romper la experiencia — el que fija el tema
    # antes del primer paint y el que agrega la clase `js`— más el bloque
    # JSON-LD, que Chrome también somete a script-src. Como nginx sirve
    # estáticos, no hay forma de generar un nonce por request.
    #
    # `script-src 'self'` sigue bloqueando la carga de JS desde otro origen,
    # que es el vector real en un sitio sin entrada de usuario ni formularios.
    # Para endurecerlo habría que calcular los hashes SHA-256 de cada script
    # inline en el build e inyectarlos acá.
    # `always` es necesario: sin él nginx omite la cabecera en respuestas de
    # error (4xx/5xx). Se repiten dentro de cada `location` porque un
    # `add_header` en un bloque hijo descarta todos los heredados del padre.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Nota sobre el caché: se usa solo `add_header Cache-Control` y no la
    # directiva `expires`. `expires` emite su propio Cache-Control, así que
    # combinarlas hace que la respuesta salga con la cabecera duplicada.

    # ── Assets con hash en el nombre: cachean para siempre ───────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Fuentes ──────────────────────────────────────────────────────────────
    location ~* \.(woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Imágenes y favicons: sin hash, caché moderada ────────────────────────
    location ~* \.(png|webp|jpe?g|gif|ico|svg|avif)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── SEO ──────────────────────────────────────────────────────────────────
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # ── HTML: nunca cachear, así un deploy se ve al instante ─────────────────
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
