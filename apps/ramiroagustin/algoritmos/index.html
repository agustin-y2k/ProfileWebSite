<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Ver el comentario equivalente en index.html: este bloque lo arma
         scripts/prerender.mjs desde src/i18n/meta.ts, un idioma por archivo. -->
    <!--meta-->
    <meta name="author" content="Ramiro Agustín Pintos" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="article" />
    <meta property="og:image" content="https://ramiroagustin.online/favicon.png" />
    <meta name="twitter:card" content="summary" />

    <link
      rel="preload"
      href="/fonts/dm-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/libre-baskerville-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      /* Idéntico al de la portada, y duplicado a propósito: tiene que correr
         antes del primer paint, así que no puede venir de un módulo. Si se
         toca uno, hay que tocar el otro. */
      (function () {
        document.documentElement.classList.add("js");
        try {
          var saved = localStorage.getItem("tema");
          if (saved === "claro" || saved === "oscuro") {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) {
          /* localStorage bloqueado: se usa la preferencia del sistema */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root" data-pagina="algoritmos" data-idioma="es"><!--app-html--></div>
    <script type="module" src="/src/entry-algoritmos.tsx"></script>
  </body>
</html>
