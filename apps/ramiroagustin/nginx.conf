# ── Idioma ───────────────────────────────────────────────────────────────────
#
# El sitio existe prerenderizado en dos idiomas: `/` en español y `/en/` en
# inglés. Elegir cuál servir es lo único que hay que decidir por request, y se
# decide acá porque acá es el único lugar donde se puede: la imagen no tiene
# Node, y hacerlo en el cliente significaría servir español y reemplazarlo a
# los milisegundos, con parpadeo y con el crawler indexando la versión
# equivocada.
#
# Los `map` van fuera del bloque `server` a propósito: pertenecen al contexto
# `http`, y este archivo se incluye desde ahí (conf.d/*.conf).

# ── Señal 1: dónde está ─────────────────────────────────────────────────────
#
# `CF-IPCountry` la agrega Cloudflare y llega hasta acá por el túnel. Depende
# de que la geolocalización por IP esté activada en el panel (Network → IP
# Geolocation); si estuviera apagada, la cabecera no llega, el valor cae en ""
# y decide la señal 2. Por eso esto es una capa y no un requisito: apagarla no
# rompe nada, solo devuelve el sitio al comportamiento anterior.
#
# La lista son los países donde el español es lengua oficial. `XX` es lo que
# manda Cloudflare cuando no pudo ubicar la IP —un proxy, una VPN, una red
# corporativa— y cae en el default junto con todo lo demás.
map $http_cf_ipcountry $idioma_pais {
    default   en;
    ""        es;
    AR        es;
    BO        es;
    CL        es;
    CO        es;
    CR        es;
    CU        es;
    DO        es;
    EC        es;
    ES        es;
    GQ        es;
    GT        es;
    HN        es;
    MX        es;
    NI        es;
    PA        es;
    PE        es;
    PR        es;
    PY        es;
    SV        es;
    UY        es;
    VE        es;
}

# ── Señal 2: qué idioma declara el navegador ────────────────────────────────
#
# Solo cuenta como español si es la PRIMERA preferencia: quien pide
# "en-US,en;q=0.9,es;q=0.8" lee inglés mejor que español. Sin cabecera —un bot,
# un curl— vale la versión canónica, que es la española.
map $http_accept_language $idioma_navegador {
    default   en;
    ""        es;
    ~*^es     es;
}

# ── Las dos juntas ──────────────────────────────────────────────────────────
#
# Alcanza con que UNA de las dos diga español. La asimetría es a propósito y va
# hacia el lado barato de equivocarse: servirle español a alguien que prefería
# inglés le cuesta un clic en el selector, mientras que servirle inglés a quien
# llegó desde San Rafael con el navegador en inglés —el caso más común de todo
# el sitio, porque cualquiera que programa tiene el navegador así— lo manda a
# una traducción de su propio idioma. La cabecera del navegador sola no
# distingue esos dos casos; el país sí.
map "$idioma_pais:$idioma_navegador" $idioma_auto {
    default   en;
    ~es       es;
}

# La elección explícita gana siempre, y por eso la cookie va última. El
# `default` que apunta a otra variable es lo que evita anidar `if`.
map $cookie_idioma $idioma {
    default   $idioma_auto;
    es        es;
    en        en;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # El `Location` de los redirects va relativo (`/en/`) y no absoluto.
    #
    # Sin esto nginx lo arma con el esquema de SU conexión, que del lado del
    # contenedor es HTTP plano: cloudflared termina el TLS afuera y entra por
    # el puerto 80. Así que un redirect saldría como `http://…` aunque la
    # persona haya pedido `https://`, y cada cambio de idioma se llevaría un
    # salto extra por Cloudflare para volver a HTTPS. Un `Location` relativo
    # es válido desde RFC 7231 y lo resuelve el navegador contra la URL que
    # pidió, que es la correcta por definición.
    absolute_redirect off;

    # ── Compresión ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml image/svg+xml;

    # ── Cabeceras de seguridad ───────────────────────────────────────────────
    #
    # Sobre `script-src 'unsafe-inline'`: el <head> lleva dos scripts inline
    # que no se pueden diferir sin romper la experiencia — el que fija el tema
    # antes del primer paint y el que agrega la clase `js`— más el bloque
    # JSON-LD, que Chrome también somete a script-src. Como nginx sirve
    # estáticos, no hay forma de generar un nonce por request.
    #
    # `script-src 'self'` sigue bloqueando la carga de JS desde otro origen,
    # que es el vector real en un sitio sin entrada de usuario ni formularios.
    # Para endurecerlo habría que calcular los hashes SHA-256 de cada script
    # inline en el build e inyectarlos acá.
    # `always` es necesario: sin él nginx omite la cabecera en respuestas de
    # error (4xx/5xx). Se repiten dentro de cada `location` porque un
    # `add_header` en un bloque hijo descarta todos los heredados del padre.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://analytics.ramiroagustin.online; font-src 'self'; connect-src 'self' https://analytics.ramiroagustin.online; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # El origen de la analítica aparece en script-src y connect-src: sin eso
    # la CSP bloquearía tanto la carga del script como el envío de los eventos.
    # Si el subdominio cambia, hay que actualizarlo en las dos directivas de
    # este archivo (la del bloque server y la del `location /`).

    # Nota sobre el caché: se usa solo `add_header Cache-Control` y no la
    # directiva `expires`. `expires` emite su propio Cache-Control, así que
    # combinarlas hace que la respuesta salga con la cabecera duplicada.

    # ── Assets con hash en el nombre: cachean para siempre ───────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Fuentes ──────────────────────────────────────────────────────────────
    location ~* \.(woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Imágenes y favicons: sin hash, caché moderada ────────────────────────
    location ~* \.(png|webp|jpe?g|gif|ico|svg|avif)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Redirección por idioma ───────────────────────────────────────────────
    #
    # Solo las dos páginas en español redirigen, y solo hacia el inglés: son
    # las URL que alguien puede escribir o recibir compartidas. Las de `/en/`
    # no redirigen nunca, así que un enlace a la versión inglesa la muestra tal
    # cual — sin eso, compartir un enlace sería una lotería.
    #
    # 302 y no 301: la respuesta depende de las cabeceras de quien pregunta, y
    # un 301 se queda cacheado en el navegador para siempre. Alguien que
    # cambiara de idioma quedaría atrapado.
    #
    # `Vary` es lo que evita que un intermediario le sirva a una persona el
    # redirect calculado para otra.
    location = / {
        if ($idioma = en) {
            return 302 /en/;
        }
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Vary "Accept-Language, Cookie, CF-IPCountry" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://analytics.ramiroagustin.online; font-src 'self'; connect-src 'self' https://analytics.ramiroagustin.online; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        try_files /index.html =404;
    }

    location = /algoritmos/ {
        if ($idioma = en) {
            return 302 /en/algoritmos/;
        }
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Vary "Accept-Language, Cookie, CF-IPCountry" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://analytics.ramiroagustin.online; font-src 'self'; connect-src 'self' https://analytics.ramiroagustin.online; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        try_files /algoritmos/index.html =404;
    }

    # El CV se sirve en /cv, sin extensión. Va antes del `location /` porque
    # ese bloque tiene el fallback a index.html y se quedaría con la petición.
    #
    # No redirige por idioma, a diferencia de las dos páginas: un CV se manda
    # por mail a alguien en particular, y ese enlace tiene que abrir la versión
    # que se eligió al mandarlo. Que el enlace en la cabecera apunte al que
    # corresponde ya lo resuelve src/i18n/meta.ts.
    location = /cv {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /cv.html =404;
    }

    location = /en/cv {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /en/cv.html =404;
    }

    # ── SEO ──────────────────────────────────────────────────────────────────
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # ── HTML: nunca cachear, así un deploy se ve al instante ─────────────────
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://analytics.ramiroagustin.online; font-src 'self'; connect-src 'self' https://analytics.ramiroagustin.online; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
