# Cada URL conserva su idioma: / en español y /en/ en inglés.
# El selector enlaza las versiones; no se redirige por país, navegador o cookie.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # El `Location` de los redirects va relativo (`/en/`) y no absoluto.
    #
    # Sin esto nginx lo arma con el esquema de SU conexión, que del lado del
    # contenedor es HTTP plano: cloudflared termina el TLS afuera y entra por
    # el puerto 80. Así que un redirect saldría como `http://…` aunque la
    # persona haya pedido `https://`, y cada cambio de idioma se llevaría un
    # salto extra por Cloudflare para volver a HTTPS. Un `Location` relativo
    # es válido desde RFC 7231 y lo resuelve el navegador contra la URL que
    # pidió, que es la correcta por definición.
    absolute_redirect off;

    # ── Compresión ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml image/svg+xml;

    # Cabeceras generadas en el build con hashes del HTML final.
    # Cada location que agrega Cache-Control debe incluirlas: nginx deja
    # de heredar TODOS los add_header del padre al declarar uno propio.
    include /etc/nginx/snippets/security-headers.conf;

    # Nota sobre el caché: se usa solo `add_header Cache-Control` y no la
    # directiva `expires`. `expires` emite su propio Cache-Control, así que
    # combinarlas hace que la respuesta salga con la cabecera duplicada.

    # ── Assets con hash en el nombre: cachean para siempre ───────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # ── Fuentes ──────────────────────────────────────────────────────────────
    location ~* \.(woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # ── Imágenes y favicons: sin hash, caché moderada ────────────────────────
    location ~* \.(png|webp|jpe?g|gif|ico|svg|avif)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Las páginas españolas siempre sirven su HTML, también para Googlebot.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /algoritmos/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /algoritmos/index.html =404;
    }

    # El CV se sirve en /cv, sin extensión. Va antes del `location /` porque
    # ese bloque tiene el fallback a index.html y se quedaría con la petición.
    #
    # Un CV se manda
    # por mail a alguien en particular, y ese enlace tiene que abrir la versión
    # que se eligió al mandarlo. Que el enlace en la cabecera apunte al que
    # corresponde ya lo resuelve src/i18n/meta.ts.
    location = /cv {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /cv.html =404;
    }

    location = /en/cv {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /en/cv.html =404;
    }

    # ── SEO ──────────────────────────────────────────────────────────────────
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # ── HTML: nunca cachear, así un deploy se ve al instante ─────────────────
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
