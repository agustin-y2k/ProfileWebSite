    <script>
      /* Corre antes del primer paint para evitar el flash de tema claro en
         quien eligió oscuro. Es la única razón por la que este script es
         inline y bloqueante: diferirlo reintroduce el parpadeo. */
      (function () {
        document.documentElement.classList.add("js");
        try {
          var saved = localStorage.getItem("tema");
          if (saved === "claro" || saved === "oscuro") {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) {
          /* localStorage bloqueado: se usa la preferencia del sistema */
        }
      })();
    </script>
