# ─────────────────────────────────────────────────────────────────────────────
# Analítica autohospedada. Opcional: se combina con el compose principal.
#
#   docker compose -f docker-compose.yml -f compose.analytics.yml up -d
#
# Requiere UMAMI_DB_PASSWORD y UMAMI_APP_SECRET en el .env. Está en un archivo
# aparte justamente para que esos requisitos no afecten a quien solo quiere
# levantar los sitios.
# ─────────────────────────────────────────────────────────────────────────────

name: sites

services:
  # ─── Analítica autohospedada ───────────────────────────────────────────────
  # Umami: sin cookies, sin datos personales, sin terceros. Los datos quedan
  # en la Pi. Se publica por el mismo túnel, en su propio subdominio.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?falta UMAMI_DB_PASSWORD en .env}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?falta UMAMI_APP_SECRET en .env}
    expose:
      - "3000"
    networks:
      - web
    depends_on:
      umami-db:
        condition: service_healthy

  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?falta UMAMI_DB_PASSWORD en .env}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    # No se expone ningún puerto: solo se llega desde la red interna.
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  # Los datos de analítica sobreviven a `docker compose down`. Ojo: `down -v`
  # sí los borra.
  umami-db-data:
